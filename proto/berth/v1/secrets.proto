syntax = "proto3";

package berth.v1;

import "berth/v1/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// SecretsService stores and brokers Keychain secrets. No message here ever carries a secret
// value: values live only in berth-native and in the child process berth run starts.
service SecretsService {
  // RequestSecret asks the person to store a value under name through the native dialog.
  // The caller learns only the outcome.
  rpc RequestSecret(RequestSecretRequest) returns (RequestSecretResponse) {
    option (berth.v1.agent) = true;
  }
  // ListSecrets lists names, consumers and use counts, never values.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (berth.v1.agent) = true;
  }
  // GrantSecret pins an executable as a consumer of a secret after Touch ID.
  rpc GrantSecret(GrantSecretRequest) returns (GrantSecretResponse);
  // AuthorizeUse returns a single use ticket when an active grant matches the executable
  // berthd identified itself.
  rpc AuthorizeUse(AuthorizeUseRequest) returns (AuthorizeUseResponse) {
    option (berth.v1.agent) = true;
  }
  // RedeemUseTicket is accepted only from the signed berth-native helper.
  rpc RedeemUseTicket(RedeemUseTicketRequest) returns (RedeemUseTicketResponse);
}

// StoreOutcome is all a requester learns about a store.
enum StoreOutcome {
  STORE_OUTCOME_UNSPECIFIED = 0;
  STORE_OUTCOME_STORED = 1;
  STORE_OUTCOME_DENIED = 2;
  STORE_OUTCOME_FAILED = 3;
}

enum GrantOutcome {
  GRANT_OUTCOME_UNSPECIFIED = 0;
  GRANT_OUTCOME_GRANTED = 1;
  GRANT_OUTCOME_DENIED = 2;
  GRANT_OUTCOME_FAILED = 3;
}

enum UseOutcome {
  USE_OUTCOME_UNSPECIFIED = 0;
  USE_OUTCOME_AUTHORIZED = 1;
  // NO_GRANT covers a secret with no grant for this executable, a revoked or denied grant,
  // and arguments that do not match the grant's glob.
  USE_OUTCOME_NO_GRANT = 2;
  // STALE_GRANT means the executable's hash changed since it was granted.
  USE_OUTCOME_STALE_GRANT = 3;
}

// SecretState mirrors the secret machine's states.
enum SecretState {
  SECRET_STATE_UNSPECIFIED = 0;
  SECRET_STATE_PENDING = 1;
  SECRET_STATE_STORED = 2;
  SECRET_STATE_DENIED = 3;
  SECRET_STATE_FAILED = 4;
}

// GrantState mirrors the grant machine's states.
enum GrantState {
  GRANT_STATE_UNSPECIFIED = 0;
  GRANT_STATE_REQUESTED = 1;
  GRANT_STATE_ACTIVE = 2;
  GRANT_STATE_DENIED = 3;
  GRANT_STATE_STALE = 4;
  GRANT_STATE_REVOKED = 5;
}

message RequestSecretRequest {
  // request_id makes the call idempotent: a retry with the same id returns the first result.
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  string name = 2 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,127}$"];
  // reason is the requester's own claim; the dialog shows it labelled as such.
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

message RequestSecretResponse {
  string name = 1;
  StoreOutcome outcome = 2;
}

message ListSecretsRequest {}

message ListSecretsResponse {
  repeated SecretSummary secrets = 1;
}

message SecretSummary {
  string name = 1;
  SecretState state = 2;
  google.protobuf.Timestamp created_at = 3;
  repeated Consumer consumers = 4;
}

// Consumer is one grant: an executable pinned to a secret.
message Consumer {
  int64 grant_id = 1;
  GrantState state = 2;
  string exe_path = 3;
  // sha256 is the executable's hash as 64 lowercase hex characters.
  string sha256 = 4;
  // team_id and signing_id are empty when the executable is not signed.
  string team_id = 5;
  string signing_id = 6;
  // args_glob is empty when the grant allows any arguments.
  string args_glob = 7;
  google.protobuf.Timestamp created_at = 8;
  // last_used_at is unset when the grant was never used.
  google.protobuf.Timestamp last_used_at = 9;
  int64 use_count = 10;
}

message GrantSecretRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  string name = 2 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,127}$"];
  string exe_path = 3 [(buf.validate.field).string = {
    prefix: "/"
    max_len: 1024
  }];
  // args_glob limits the arguments the grant allows; empty allows any.
  string args_glob = 4 [(buf.validate.field).string.max_len = 1024];
  // allow_interpreter accepts an interpreter executable; the Touch ID text then warns that it
  // can print the secret.
  bool allow_interpreter = 5;
}

message GrantSecretResponse {
  GrantOutcome outcome = 1;
  // consumer is what berthd identified and pinned; set only when outcome is GRANTED.
  Consumer consumer = 2;
}

message AuthorizeUseRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  string name = 2 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,127}$"];
  // exe_path is resolved by the caller; berthd hashes the file itself and never trusts a client hash.
  string exe_path = 3 [(buf.validate.field).string = {
    prefix: "/"
    max_len: 1024
  }];
  // argv excludes the executable itself.
  repeated string argv = 4 [(buf.validate.field).repeated = {
    max_items: 256
    items: {
      string: {max_len: 4096}
    }
  }];
}

message AuthorizeUseResponse {
  UseOutcome outcome = 1;
  // ticket is 32 random bytes, set only when outcome is AUTHORIZED. It is bound to the name,
  // the executable hash and the caller's pid, and is valid once until expires_at.
  bytes ticket = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message RedeemUseTicketRequest {
  // The handler checks the peer is berth-native before it consults the request log, so a
  // replayed request_id from another process learns nothing.
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  bytes ticket = 2 [(buf.validate.field).bytes.len = 32];
}

message RedeemUseTicketResponse {
  // name is the secret berth-native reads from Keychain item berth.<name>.
  string name = 1;
}
