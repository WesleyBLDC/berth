syntax = "proto3";

package berth.v1;

import "berth/v1/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// SecretsService stores and brokers Keychain secrets. No message here ever carries a secret
// value: values live only in berth-native and in the child process berth run starts.
service SecretsService {
  // RequestSecret asks the person to store a value under name through the native dialog.
  // The caller learns only the outcome.
  rpc RequestSecret(RequestSecretRequest) returns (RequestSecretResponse) {
    option (berth.v1.agent) = true;
  }
  // ListSecrets lists names, consumers and use counts, never values.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (berth.v1.agent) = true;
  }
  // GrantSecret pins an executable as a consumer of a secret after Touch ID.
  rpc GrantSecret(GrantSecretRequest) returns (GrantSecretResponse);
  // AuthorizeUse returns a single use ticket when an active grant matches the executable
  // berthd identified itself.
  rpc AuthorizeUse(AuthorizeUseRequest) returns (AuthorizeUseResponse) {
    option (berth.v1.agent) = true;
  }
  // RedeemUseTicket is accepted only from the signed berth-native helper.
  rpc RedeemUseTicket(RedeemUseTicketRequest) returns (RedeemUseTicketResponse);
  // GrantProxy pins an HTTPS target as a consumer of a secret after Touch ID: berth-proxy may
  // then write the value into one header of requests to that host.
  rpc GrantProxy(GrantProxyRequest) returns (GrantProxyResponse);
  // RevokeGrant revokes one grant without Touch ID, since it only lowers privilege, and stops
  // running proxy sessions that hold it.
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
  // RemoveSecret deletes the Keychain item after Touch ID, then revokes every grant, drops live
  // tickets and stops proxy sessions on the secret.
  rpc RemoveSecret(RemoveSecretRequest) returns (RemoveSecretResponse);
  // RotateSecret replaces the stored value through the store dialog and Touch ID. Grants stay
  // Active; running proxy sessions keep the old value until they end.
  rpc RotateSecret(RotateSecretRequest) returns (RotateSecretResponse);
  // AuthorizeProxy is accepted only from the signed berth-proxy. It matches an Active proxy grant
  // per name and returns one ticket per grant, bound to the name and the proxy's pid.
  rpc AuthorizeProxy(AuthorizeProxyRequest) returns (AuthorizeProxyResponse) {
    option (berth.v1.agent) = true;
  }
  // WatchProxySession is accepted only from the process that authorized the session. The proxy
  // zeroes its values and exits on a stop event or when the stream breaks.
  rpc WatchProxySession(WatchProxySessionRequest) returns (stream WatchProxySessionResponse) {
    option (berth.v1.agent) = true;
  }
  // EndProxySession is accepted only from the process that authorized the session; it records
  // counts, never paths, hosts beyond the grants, or values.
  rpc EndProxySession(EndProxySessionRequest) returns (EndProxySessionResponse) {
    option (berth.v1.agent) = true;
  }
}

// StoreOutcome is all a requester learns about a store.
enum StoreOutcome {
  STORE_OUTCOME_UNSPECIFIED = 0;
  STORE_OUTCOME_STORED = 1;
  STORE_OUTCOME_DENIED = 2;
  STORE_OUTCOME_FAILED = 3;
}

enum GrantOutcome {
  GRANT_OUTCOME_UNSPECIFIED = 0;
  GRANT_OUTCOME_GRANTED = 1;
  GRANT_OUTCOME_DENIED = 2;
  GRANT_OUTCOME_FAILED = 3;
}

enum UseOutcome {
  USE_OUTCOME_UNSPECIFIED = 0;
  USE_OUTCOME_AUTHORIZED = 1;
  // NO_GRANT covers a secret with no grant for this executable, a revoked or denied grant,
  // and arguments that do not match the grant's glob.
  USE_OUTCOME_NO_GRANT = 2;
  // STALE_GRANT means the executable's hash changed since it was granted.
  USE_OUTCOME_STALE_GRANT = 3;
}

// SecretState mirrors the secret machine's states.
enum SecretState {
  SECRET_STATE_UNSPECIFIED = 0;
  SECRET_STATE_PENDING = 1;
  SECRET_STATE_STORED = 2;
  SECRET_STATE_DENIED = 3;
  SECRET_STATE_FAILED = 4;
  SECRET_STATE_ROTATING = 5;
  SECRET_STATE_REMOVING = 6;
  SECRET_STATE_REMOVED = 7;
}

// ConsumerKind says what a grant pins: an executable that receives the value in its
// environment, or an HTTPS target berth-proxy writes it to.
enum ConsumerKind {
  CONSUMER_KIND_UNSPECIFIED = 0;
  CONSUMER_KIND_EXECUTABLE = 1;
  CONSUMER_KIND_PROXY = 2;
}

// SignatureKind is what berthd verified about an executable's code signature. UNSPECIFIED means
// the grant predates the field and the kind was never read.
enum SignatureKind {
  SIGNATURE_KIND_UNSPECIFIED = 0;
  // No valid signature.
  SIGNATURE_KIND_UNSIGNED = 1;
  // A valid ad hoc signature, which names no signer.
  SIGNATURE_KIND_AD_HOC = 2;
  // Signed by Apple itself (the requirement "anchor apple"), as macOS platform binaries are.
  SIGNATURE_KIND_APPLE_PLATFORM = 3;
  // Signed by a certificate that names a team; team_id holds it.
  SIGNATURE_KIND_TEAM = 4;
  // A valid signature from a certificate that is neither Apple's nor a team's, such as self signed.
  SIGNATURE_KIND_OTHER = 5;
}

// RemoveOutcome is all a caller learns about a remove.
enum RemoveOutcome {
  REMOVE_OUTCOME_UNSPECIFIED = 0;
  REMOVE_OUTCOME_REMOVED = 1;
  REMOVE_OUTCOME_DENIED = 2;
  REMOVE_OUTCOME_FAILED = 3;
}

// TicketAction says what berth-native may do with a redeemed ticket.
enum TicketAction {
  TICKET_ACTION_UNSPECIFIED = 0;
  // USE reads the value and writes it to fd 3.
  TICKET_ACTION_USE = 1;
  TICKET_ACTION_REMOVE = 2;
  TICKET_ACTION_ROTATE = 3;
}

// ProxyStopReason tells berth-proxy why berthd ended its session.
enum ProxyStopReason {
  PROXY_STOP_REASON_UNSPECIFIED = 0;
  PROXY_STOP_REASON_GRANT_REVOKED = 1;
  PROXY_STOP_REASON_SECRET_REMOVED = 2;
  PROXY_STOP_REASON_DAEMON_STOPPING = 3;
  // AGENT_SESSION_ENDED means the agent session the proxy was authorized through was revoked,
  // expired or lost its root process.
  PROXY_STOP_REASON_AGENT_SESSION_ENDED = 4;
}

enum ProxySessionEventKind {
  PROXY_SESSION_EVENT_KIND_UNSPECIFIED = 0;
  // SERVING is the first event: berthd moved the session to Serving.
  PROXY_SESSION_EVENT_KIND_SERVING = 1;
  // STOP ends the session; the proxy zeroes its values and exits.
  PROXY_SESSION_EVENT_KIND_STOP = 2;
}

// GrantState mirrors the grant machine's states.
enum GrantState {
  GRANT_STATE_UNSPECIFIED = 0;
  GRANT_STATE_REQUESTED = 1;
  GRANT_STATE_ACTIVE = 2;
  GRANT_STATE_DENIED = 3;
  GRANT_STATE_STALE = 4;
  GRANT_STATE_REVOKED = 5;
}

message RequestSecretRequest {
  // request_id makes the call idempotent: a retry with the same id returns the first result.
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  string name = 2 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,127}$"];
  // reason is the requester's own claim; the dialog shows it labelled as such.
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

message RequestSecretResponse {
  string name = 1;
  StoreOutcome outcome = 2;
}

message ListSecretsRequest {}

message ListSecretsResponse {
  repeated SecretSummary secrets = 1;
}

message SecretSummary {
  string name = 1;
  SecretState state = 2;
  google.protobuf.Timestamp created_at = 3;
  repeated Consumer consumers = 4;
}

// Consumer is one grant: an executable pinned to a secret.
message Consumer {
  int64 grant_id = 1;
  GrantState state = 2;
  string exe_path = 3;
  // sha256 is the executable's hash as 64 lowercase hex characters.
  string sha256 = 4;
  // team_id is set only for a TEAM signature; signing_id is empty when the executable is not
  // validly signed.
  string team_id = 5;
  string signing_id = 6;
  // args_glob is empty when the grant allows any arguments.
  string args_glob = 7;
  google.protobuf.Timestamp created_at = 8;
  // last_used_at is unset when the grant was never used.
  google.protobuf.Timestamp last_used_at = 9;
  int64 use_count = 10;
  // pass_env names the environment variables, beyond Berth's fixed allowlist, that berth run
  // passes from its own environment to this consumer.
  repeated string pass_env = 11;
  // kind is EXECUTABLE for the exe fields above and PROXY for proxy, never both.
  ConsumerKind kind = 12;
  ProxyTarget proxy = 13;
  // signature is set for EXECUTABLE consumers.
  SignatureKind signature = 14;
}

// ProxyTarget is where berth-proxy may write a secret: one header on requests to one HTTPS host
// and port. The written header is <header_name>: <value_prefix><value><value_suffix>.
message ProxyTarget {
  // host is a lowercase DNS name. berthd also refuses IP literals and localhost outside e2e builds.
  string host = 1 [(buf.validate.field).string = {
    max_len: 253
    pattern: "^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?[.])*[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
  }];
  // port 0 means 443.
  uint32 port = 2 [(buf.validate.field).uint32.lte = 65535];
  // header_name is an HTTP token. Headers that frame or route a request, or talk to a proxy,
  // can never be granted.
  string header_name = 3 [
    (buf.validate.field).string.pattern = "^[!#$%&'*+.^_`|~0-9A-Za-z-]{1,64}$",
    (buf.validate.field).cel = {
      id: "header_name_grantable"
      message: "this header frames or routes the request and cannot be granted"
      expression: "!(this.lowerAscii() in ['host', 'content-length', 'transfer-encoding', 'connection', 'upgrade', 'te', 'trailer']) && !this.lowerAscii().startsWith('proxy-')"
    }
  ];
  // value_prefix and value_suffix are printable ASCII, so no CR, LF or NUL reaches the header.
  string value_prefix = 4 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^[\\x20-\\x7E]*$"
  }];
  string value_suffix = 5 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^[\\x20-\\x7E]*$"
  }];
  // path_glob limits the request paths; empty allows any.
  string path_glob = 6 [(buf.validate.field).string = {
    max_len: 1024
    pattern: "^[\\x21-\\x7E]*$"
  }];
  // methods limits the request methods; empty allows any.
  repeated string methods = 7 [(buf.validate.field).repeated = {
    max_items: 16
    unique: true
    items: {
      string: {pattern: "^[A-Z]{1,16}$"}
    }
  }];
  // placeholder_env names a variable berth run sets in the child to a fixed placeholder, for
  // tools that refuse to start without a key; empty sets none.
  string placeholder_env = 8 [(buf.validate.field).string.pattern = "^([A-Z_][A-Z0-9_]{0,63})?$"];
}

message GrantSecretRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  string name = 2 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,127}$"];
  string exe_path = 3 [(buf.validate.field).string = {
    prefix: "/"
    max_len: 1024
  }];
  // args_glob limits the arguments the grant allows; empty allows any.
  string args_glob = 4 [(buf.validate.field).string.max_len = 1024];
  // allow_interpreter accepts an interpreter executable; the Touch ID text then warns that it
  // can print the secret.
  bool allow_interpreter = 5;
  // pass_env names environment variables berth run may pass to the consumer beyond Berth's
  // fixed allowlist. The Touch ID text lists them. DYLD_*, LD_*, *_OPTIONS, *_OPTS and *OPT
  // are always dropped, because they make a tool load or run other code.
  repeated string pass_env = 6 [(buf.validate.field).repeated = {
    max_items: 32
    unique: true
    items: {
      string: {pattern: "^[A-Z_][A-Z0-9_]{0,63}$"}
    }
  }];
}

message GrantSecretResponse {
  GrantOutcome outcome = 1;
  // consumer is what berthd identified and pinned; set only when outcome is GRANTED.
  Consumer consumer = 2;
}

message AuthorizeUseRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  string name = 2 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,127}$"];
  // exe_path is resolved by the caller; berthd hashes the file itself and never trusts a client hash.
  string exe_path = 3 [(buf.validate.field).string = {
    prefix: "/"
    max_len: 1024
  }];
  // argv excludes the executable itself.
  repeated string argv = 4 [(buf.validate.field).repeated = {
    max_items: 256
    items: {
      string: {max_len: 4096}
    }
  }];
}

message AuthorizeUseResponse {
  UseOutcome outcome = 1;
  // ticket is 32 random bytes, set only when outcome is AUTHORIZED. It is bound to the name,
  // the executable hash and the caller's pid, and is valid once until expires_at.
  bytes ticket = 2;
  google.protobuf.Timestamp expires_at = 3;
  // pass_env is the matched grant's list; berth run passes only these beyond the allowlist.
  repeated string pass_env = 4;
  // cdhash is the code directory hash berthd read from the executable when it was granted (for a
  // script, its interpreter's), 20 bytes. berth run starts the child suspended and runs it only
  // if the kernel reports this cdhash for it. Empty when the grant pinned none.
  bytes cdhash = 5;
}

message RedeemUseTicketRequest {
  // The handler checks the peer is berth-native before it consults the request log, so a
  // replayed request_id from another process learns nothing.
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  bytes ticket = 2 [(buf.validate.field).bytes.len = 32];
}

message RedeemUseTicketResponse {
  // name is the secret berth-native reads from Keychain item berth.<name>.
  string name = 1;
  // consumer_kind must match berth-native's parent: EXECUTABLE for berth, PROXY for berth-proxy.
  ConsumerKind consumer_kind = 2;
  TicketAction action = 3;
}

message GrantProxyRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  string name = 2 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,127}$"];
  ProxyTarget target = 3 [(buf.validate.field).required = true];
}

message GrantProxyResponse {
  GrantOutcome outcome = 1;
  // consumer is set only when outcome is GRANTED.
  Consumer consumer = 2;
}

message RevokeGrantRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  int64 grant_id = 2 [(buf.validate.field).int64.gt = 0];
}

message RevokeGrantResponse {
  GrantState state = 1;
}

message RemoveSecretRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  string name = 2 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,127}$"];
}

message RemoveSecretResponse {
  RemoveOutcome outcome = 1;
  // revoked_grant_ids lists the grants revoked because the secret was removed.
  repeated int64 revoked_grant_ids = 2;
}

message RotateSecretRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  string name = 2 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,127}$"];
}

message RotateSecretResponse {
  // outcome is STORED when the new value replaced the old one.
  StoreOutcome outcome = 1;
}

message AuthorizeProxyRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  repeated string names = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 16
    unique: true
    items: {
      string: {pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"}
    }
  }];
}

message AuthorizeProxyResponse {
  // outcome is AUTHORIZED only when every name has an Active proxy grant; otherwise no session
  // is made and nothing else is set.
  UseOutcome outcome = 1;
  // session_id is 32 lowercase hex characters; the session's entity is proxy/<session_id>.
  string session_id = 2;
  repeated ProxyTicket tickets = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// ProxyTicket lets berth-native read one secret for berth-proxy, once.
message ProxyTicket {
  string name = 1;
  // ticket is 32 random bytes, bound to the name and the proxy's pid; never written down.
  bytes ticket = 2;
  ProxyTarget target = 3;
}

message WatchProxySessionRequest {
  string session_id = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{32}$"];
}

message WatchProxySessionResponse {
  ProxySessionEvent event = 1;
}

message ProxySessionEvent {
  ProxySessionEventKind kind = 1;
  // stop_reason is set only on STOP.
  ProxyStopReason stop_reason = 2;
}

message EndProxySessionRequest {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
  string session_id = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{32}$"];
  // injected counts requests that got the header; refused counts requests a method or path
  // limit, or a Host mismatch, turned away.
  uint64 injected = 3;
  uint64 refused = 4;
}

message EndProxySessionResponse {}
