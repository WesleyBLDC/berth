syntax = "proto3";

package berth.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// DebugService lets people and agents debug by reading state, not by guessing from logs.
service DebugService {
  rpc GetState(GetStateRequest) returns (GetStateResponse);
}

message GetStateRequest {
  string entity = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  uint32 history_limit = 2 [(buf.validate.field).uint32.lte = 500];
}

message Transition {
  int64 version = 1;
  string event = 2;
  string from_state = 3;
  string to_state = 4;
  google.protobuf.Timestamp at = 5;
  string detail = 6;
}

message GetStateResponse {
  string entity = 1;
  string kind = 2;
  string state = 3;
  int64 version = 4;
  repeated Transition history = 5;
}
