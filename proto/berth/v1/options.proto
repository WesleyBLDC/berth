syntax = "proto3";

package berth.v1;

import "google/protobuf/descriptor.proto";

extend google.protobuf.MethodOptions {
  // agent marks a method that agents may call with a session token.
  // The MCP shim and the agent commands expose exactly these methods, and the agent socket
  // serves only these.
  bool agent = 50001;
  // app marks a method only the signed Berth.app may call: berthd serves it on the owner socket
  // to a peer running the Berth.app beside berthd, by its code identity, and refuses everyone
  // else with ERROR_REASON_NOT_BERTH_APP. Listing and watching methods are never marked.
  bool app = 50002;
}

// ErrorReason is attached to errors so clients can show a typed reason.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_PROTOCOL_MISMATCH = 1;
  ERROR_REASON_REQUEST_ID_REUSED = 2;
  ERROR_REASON_NOT_SERVING = 3;
  // SECRET_NOT_FOUND means no secret with that name is in the Stored state.
  ERROR_REASON_SECRET_NOT_FOUND = 4;
  // SECRET_EXISTS refuses a store over a secret that is already Stored; replacing is rotate.
  ERROR_REASON_SECRET_EXISTS = 5;
  // EXECUTABLE_NOT_FOUND means berthd could not resolve or read the named executable.
  ERROR_REASON_EXECUTABLE_NOT_FOUND = 6;
  // TICKET_INVALID covers unknown, expired and already redeemed tickets alike.
  ERROR_REASON_TICKET_INVALID = 7;
  // PEER_NOT_TRUSTED means the calling process is not the signed Berth binary the method
  // needs: berth-native for RedeemUseTicket, the berth CLI for an AuthorizeUse ticket, and
  // berth-proxy for AuthorizeProxy. WatchProxySession and EndProxySession also answer it for an
  // unknown session or one another process authorized, so ids cannot be probed.
  ERROR_REASON_PEER_NOT_TRUSTED = 8;
  // INTERPRETER refuses a grant to an interpreter (a shell, python, a #! script) unless the
  // request sets allow_interpreter, since anything it runs could print the secret.
  ERROR_REASON_INTERPRETER = 9;
  // BUSY refuses a remove or rotate while the secret is Pending or Rotating, or one of its
  // grants waits for Touch ID.
  ERROR_REASON_BUSY = 10;
  // BAD_PROXY_TARGET refuses a proxy target berthd will not grant, such as an IP literal or
  // localhost outside e2e builds, or a placeholder variable berth run sets itself.
  ERROR_REASON_BAD_PROXY_TARGET = 11;
  // GRANT_NOT_FOUND means no grant has that id.
  ERROR_REASON_GRANT_NOT_FOUND = 12;
  // NOT_AGENT_METHOD refuses, on the agent socket, every method not marked agent.
  ERROR_REASON_NOT_AGENT_METHOD = 13;
  // SESSION_NOT_FOUND means no browser session has that id.
  ERROR_REASON_SESSION_NOT_FOUND = 14;
  // SESSION_NOT_STOPPABLE refuses a stop of another user's browser, or of one owned by the
  // person or an app without force.
  ERROR_REASON_SESSION_NOT_STOPPABLE = 15;
  // AGENT_TOKEN_INVALID refuses an agent socket call whose berth-agent-token header is missing,
  // unknown, expired or revoked, whose session ended, or that comes from a process outside the
  // session's process tree; one reason for all, so a copied token learns nothing.
  ERROR_REASON_AGENT_TOKEN_INVALID = 16;
  // RATE_LIMITED refuses a store request beyond an agent session's limit on store dialogs, a
  // StartProxy beyond its limits on proxies berthd runs for it at once or starts in an hour, an
  // agent browser beyond its limits, and a WatchSessions beyond the open stream limit. The message
  // says which limit.
  ERROR_REASON_RATE_LIMITED = 17;
  // AGENT_SESSION_NOT_FOUND means no agent session has that id.
  ERROR_REASON_AGENT_SESSION_NOT_FOUND = 18;
  // PROFILE_BUSY refuses a browser launch on a profile a live browser already uses.
  ERROR_REASON_PROFILE_BUSY = 19;
  // BROWSER_NOT_FOUND means no managed browser has that id.
  ERROR_REASON_BROWSER_NOT_FOUND = 20;
  // BROWSER_LAUNCH_FAILED means the browser did not start or did not answer over its pipe, or
  // the named executable is not a Chromium family browser.
  ERROR_REASON_BROWSER_LAUNCH_FAILED = 21;
  // BAD_GLOB refuses an args_glob that is not a valid pattern.
  ERROR_REASON_BAD_GLOB = 22;
  // PROXY_NOT_STARTED means berthd could not start berth-proxy for StartProxy, or the proxy did
  // not come up; berthd's log says why.
  ERROR_REASON_PROXY_NOT_STARTED = 23;
  // ENTITY_NOT_FOUND means GetState found no state machine entity with that name.
  ERROR_REASON_ENTITY_NOT_FOUND = 24;
  // NOT_BERTH_APP refuses a method marked app to any caller that is not the signed Berth.app
  // beside berthd.
  ERROR_REASON_NOT_BERTH_APP = 25;
}

message ErrorInfo {
  ErrorReason reason = 1;
}
