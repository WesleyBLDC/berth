# Run with prek: `make hooks` installs it, `prek run --all-files` checks everything.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        # Report, never rewrite; the style comes from .editorconfig's [*.sh] section.
        args: [-d]
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.5
    hooks:
      - id: rumdl-check
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (every Go module)
        entry: scripts/lint-go.sh
        language: system
        types: [go]
        pass_filenames: false
      - id: buf
        name: buf format and lint
        entry: scripts/lint-proto.sh
        language: system
        types: [proto]
        pass_filenames: false
      - id: swift-format
        name: swift format lint
        entry: scripts/lint-swift.sh
        language: system
        types: [swift]
      - id: no-dash-punctuation
        name: no em or en dashes in docs
        entry: '—|–'
        language: pygrep
        types_or: [markdown, text]
        exclude: ^\.pre-commit-config\.yaml$
