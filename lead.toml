# Lead mode settings for Berth. Workers can ignore this file.
name = "berth"
done = "make check"
pass_line = "check: PASS"
leash = "held"
ci = false
worker = "berth-worker"
reviewer = "berth-reviewer"
test_by = "tester"
reviewer_may_run = "make test"
cap = 3
per_message = 2
shared_files = "serialize"
plans = "ARCHITECTURE.md (milestone status) and docs/plans/ (one plan per milestone)"
attention_floor = ["proto/**:approve", "internal/core/**:approve", "docs/adr/**:approve"]
