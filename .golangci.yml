version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    exhaustive:
      default-signifies-exhaustive: false
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        # Comments explain why, never what, so exported names do not each need a doc comment.
        - name: exported
          disabled: true
        - name: package-comments
        - name: unused-parameter
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-return
        - name: blank-imports
        - name: context-as-argument
        - name: receiver-naming
    depguard:
      rules:
        core-imports-no-adapters:
          files:
            - "**/internal/core/**"
          deny:
            - pkg: "berth/internal/adapters"
              desc: "the core talks to ports only; adapters live outside it"
            - pkg: "database/sql"
              desc: "storage goes through the Store port"
            - pkg: "os/exec"
              desc: "process work goes through a port"
            - pkg: "net/http"
              desc: "the core has no transport"
    forbidigo:
      forbid:
        - pattern: '^time\.Now$'
          msg: "use the Clock port so tests control time"
        - pattern: '^fmt\.Print'
          msg: "use slog"
      exclude-godoc-examples: true
  exclusions:
    rules:
      # The Clock and print rules guard the core; adapters and commands may use time and stdout.
      - path-except: '(^|/)internal/core/'
        linters: [forbidigo]
      - path: '_test\.go'
        linters: [gosec, forbidigo]
      - path: '(^|/)gen/'
        linters: [revive, gocritic, unparam]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      # The module path has no dot, so gofumpt must be told berth/... is not the standard library.
      module-path: berth
    goimports:
      local-prefixes:
        - berth
  exclusions:
    paths:
      - '(^|/)gen/'
